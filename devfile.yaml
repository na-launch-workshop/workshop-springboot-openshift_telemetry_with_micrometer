schemaVersion: 2.2.2
metadata:
  name: workshop-springboot-openshift_telemetry_with_micrometer
  version: 1.0.0
  description: DevSpaces workspace for Springboot app
attributes:
  che-editor: vscode
components:
  - name: tools        
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/fullstack-dev-tools:latest
      env:
        - name: SERVER_ADDRESS
          value: 0.0.0.0
        - name: VSCODE_DEFAULT_WORKSPACE
          value: "$(PROJECT_SOURCE)/vscode.code-workspace"
        - name: MAVEN_OPTS
          value: "-Djavax.net.ssl.trustStore=/etc/pki/ca-trust/extracted/java/cacerts"
      endpoints:
        - exposure: none
          name: kilo-code
          protocol: tcp
          targetPort: 4096
        - exposure: none
          name: debug
          protocol: tcp
          targetPort: 5005
        - exposure: public
          name: hello-by-lang
          protocol: https
          targetPort: 8080          
          path: /work
      cpuLimit: '4'
      cpuRequest: '500m'
      memoryLimit: '6Gi'
      memoryRequest: '2Gi'
      mountSources: true
  - name: projects
    volume:
      size: 50Gi
  - name: prep-workspace
    container:
      args:
        - '-c'
        - >-
          mkdir -p /projects/.bin && cp /usr/bin/oc /projects/.bin/oc && cp /usr/bin/kubectl /projects/.bin/kubectl
      command:
        - /bin/bash
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      mountSources: true
      sourceMapping: /projects
      memoryRequest: 128Mi
      memoryLimit: 256Mi
      cpuRequest: 10m
      cpuLimit: 200m
      env:
      - name: HOME
        value: "/projects"

commands:
  - id: prep-workspace
    apply:
      component: prep-workspace
      label: Pre Start Prep
  - id: 1-package
    exec:
      label: "1. Package the application"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn package"
      group:
        kind: build
        isDefault: true
  - id: 2-startdev
    exec:
      label: "2. Start Development mode (Hot reload + debug)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn spring-boot:run"
      group:
        kind: run
        isDefault: true
  - id: 3-debug
    exec:
      label: "3. Start with Debug"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "mvn spring-boot:run -Dspring-boot.run.jvmArguments='-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=5005'"
      group:
        kind: run

events:
  preStart:
    - prep-workspace

